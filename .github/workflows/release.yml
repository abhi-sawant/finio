name: Release

# Publishes a GitHub Release whenever a push to main carries a VERSION that has no tag yet.
# The release skill bumps VERSION + web/package.json and writes the CHANGELOG section; this
# workflow builds the web zip and the signed APK, and creates the release from them.
#
# - Tag: the bare version (`3.3.2`), matching every earlier release. It is created by
#   `gh release create` on the pushed commit, so no manual tagging.
# - Notes: the `## X.Y.Z — date` section of CHANGELOG.md, plus a downloads table and the APK
#   certificate. The Android app shows this body in its update dialog
#   (`core/.../update/AppUpdate.kt`), so it must stay the changelog.
# - Idempotent: if the tag already exists the run does nothing, so re-runs, unrelated VERSION
#   edits and several pushes in a row can never release a version twice.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (base64 of android/keystore/finio-release.jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Variables (optional): VITE_API_URL, FINIO_API_URL.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every release must be signed by this certificate, or Android refuses to install it as an
  # update. Change it only if the signing key is deliberately replaced.
  EXPECTED_CERT_SHA256: '4e:a6:03:36:0a:e5:73:a7:fa:1d:ae:6c:ed:96:c8:df:3d:6f:c8:89:02:62:1d:2e:45:3f:f4:a5:ce:54:23:1f'

jobs:
  check:
    # A manual run from another branch must not publish a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::'$version' is not X.Y.Z"
            exit 1
          fi
          pkg="$(jq -r .version web/package.json)"
          if [[ "$pkg" != "$version" ]]; then
            echo "::error file=web/package.json::version $pkg does not match VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Skip if already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything between `## X.Y.Z …` and the next `## ` heading, blank edges trimmed.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > changelog-section.md
          if [[ ! -s changelog-section.md ]]; then
            echo "::error file=CHANGELOG.md::no '## $VERSION — YYYY-MM-DD' section (or it is empty)"
            exit 1
          fi
          cat changelog-section.md

      - if: steps.tag.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-section
          path: changelog-section.md

  web:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Includes the golden-fixture and VERSION/package.json checks.
      - run: npm test

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Files at the zip root, ready to upload to any static host.
      - name: Zip web/dist
        run: |
          cd dist
          zip -qr "$GITHUB_WORKSPACE/finio-web-$VERSION.zip" . -x '.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: finio-web-${{ needs.check.outputs.version }}.zip
          if-no-files-found: error

  android:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Same major as Android Studio's bundled JBR, which builds the app locally.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing; an unsigned APK cannot be released."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/finio-release.jks
          {
            echo "storeFile=keystore/finio-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        env:
          FINIO_API_URL: ${{ vars.FINIO_API_URL }}
        run: |
          args=(:core:test :app:assembleRelease)
          [[ -n "$FINIO_API_URL" ]] && args+=("-PfinioApiUrl=$FINIO_API_URL")
          ./gradlew "${args[@]}"

      - name: Verify signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || { echo "$out"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$out" | grep -v '^WARNING:'
          # The line's prefix varies by build-tools version ("Signer #1", "V2 Signer", …), so match on the tail.
          digest="$(echo "$out" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'A-F' 'a-f' | sed 's/../&:/g; s/:$//')"
          echo "APK certificate: $digest"
          if [[ "$digest" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed by $digest, expected $EXPECTED_CERT_SHA256. Android would refuse it as an update."
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/finio-$VERSION.apk"

      - name: Remove signing key
        if: always()
        run: rm -rf keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: finio-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: [check, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd artifacts
          apk="finio-$VERSION.apk"
          zip="finio-web-$VERSION.zip"
          sha256sum "$apk" "$zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            cat changelog-section.md
            echo
            echo "## Downloads"
            echo
            echo "| File | What |"
            echo "| --- | --- |"
            echo "| \`$apk\` | Android app. Install it over an earlier version and your data stays. |"
            echo "| \`$zip\` | Production build of the web app, ready to upload to any static host. |"
            echo "| \`SHA256SUMS.txt\` | Checksums for both files. |"
            echo
            echo "**APK signing certificate (SHA-256):**"
            echo "\`$EXPECTED_CERT_SHA256\`"
            echo
            echo "Full details are in [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$VERSION/CHANGELOG.md)."
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Finio $VERSION" \
            --notes-file notes.md \
            "finio-$VERSION.apk" "finio-web-$VERSION.zip" SHA256SUMS.txt
